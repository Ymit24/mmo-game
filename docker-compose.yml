services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
    environment:
      PORT: 3001
      AUTH_DB_PATH: /app/data/auth.sqlite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-0}
      ADMIN_API_BEARER_TOKEN: ${ADMIN_API_BEARER_TOKEN:-}
      ADMIN_API_ALLOWED_ORIGINS: ${ADMIN_API_ALLOWED_ORIGINS:-}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3001/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - mmo_data:/app/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

volumes:
  mmo_data:
